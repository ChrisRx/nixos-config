version: '3'

vars:
  HOSTNAME:
    sh: hostname
  ARGS: "--sudo --upgrade --flake .#{{ .HOSTNAME }}"
  VERBOSE:
    sh: '[[ "$LOG_LEVEL" == "debug" ]] && echo "-v" || true'

tasks:
  build:
    cmds:
      - nixos-rebuild build {{ .ARGS }} {{ .VERBOSE }} {{ .CLI_ARGS }}

  build:test:
    cmds:
      - nixos-rebuild dry-build {{ .ARGS }} -v {{ .CLI_ARGS }}

  update:
    cmds:
      - sudo nix flake update {{ .VERBOSE }}

  upgrade:
    deps:
      - update
    cmds:
      - nixos-rebuild switch {{ .ARGS }} {{ .VERBOSE }} {{ .CLI_ARGS }}

  clean:
    cmds:
      - nix-collect-garbage
      - nix-collect-garbage -d
      - nix-store --optimize
      - sudo nix-collect-garbage -d
      - task: upgrade

  firmware:update:
    cmds:
      - sudo fwupdmgr refresh --force
      - sudo fwupdmgr get-updates
      - sudo fwupdmgr update

  # Refresh the whole kernel pin table that modules/nixos/core/kernel.nix reads.
  # Run periodically: each series is pinned to the newest nixpkgs revision that
  # still carries it, so one is already available whenever a host needs it.
  # The argument is a floor, not an exact major, so 8.x is picked up on its own.
  kernel:pin:
    desc: Refresh the frozen kernel revision table (task kernel:pin -- 8 raises the floor)
    silent: true
    cmds:
      - |
        set -eu
        dest=modules/nixos/core/kernel-pins.json

        # Via a temp file, not a direct redirect: the script reads $dest as
        # PREVIOUS_PINS, and the shell would truncate it before the run starts.
        # The output carries no timestamp, so an unchanged table rewrites
        # byte-identically and leaves nothing for git to commit.
        PREVIOUS_PINS="$dest" ./scripts/find-kernel-pins.sh {{ .CLI_ARGS }} > "$dest.new"
        mv "$dest.new" "$dest"

        jq -r '"pinned \(.branch) (floor \(.minMajor))",
               (.series | to_entries[] | "  \(.key) -> \(.value.version)  \(.value.rev[0:12])")' "$dest"

  nvim:install:
    cmds:
      - nix profile install .#neovim
  nvim:run:
    cmds:
      - nix run .#neovim
  # Materialise the module into a self-contained config dir for a machine with
  # no nix. Plugins are dereferenced out of the store; the LSP servers and tools
  # the wrapper puts on PATH are NOT included and must be installed on the target.
  nvim:vendor:
    desc: Vendor the neovim module into a plain config dir (DEST=./dist/nvim)
    silent: true
    vars:
      DEST: '{{ .DEST | default "./dist/nvim" }}'
    cmds:
      - |
        set -eu
        out=$(nix build --no-link --print-out-paths .#neovim {{ .VERBOSE }})
        pack=$(grep -o 'packpath\^=[^"]*' "$out/bin/nvim" | head -n1 | cut -d'=' -f2)
        dest={{ .DEST }}

        rm -rf "$dest"
        mkdir -p "$dest/pack/nixvim/start"

        # Neovim sources init.lua before loading 'start' packages, and finds them
        # via 'packpath' (which the generated config never touches) rather than
        # 'runtimepath', so its stdpath("config") removal does not affect these.
        "$out/bin/nixvim-print-init" > "$dest/init.lua"
        printf '%s\n' \
          '' \
          '-- vendored: the store provider hosts above do not exist off-nix' \
          'vim.g.ruby_host_prog = nil' \
          'vim.g.python3_host_prog = nil' \
          'vim.g.loaded_ruby_provider = 0' \
          'vim.g.loaded_python3_provider = 0' >> "$dest/init.lua"

        # -R not -r: BSD cp on macOS does not reliably accept the lowercase form.
        cp -RL "$pack/pack/myNeovimPackages/start/." "$dest/pack/nixvim/start/"
        chmod -R u+w "$dest"

        printf '\nvendored %s plugins into %s (%s)\n' \
          "$(ls "$dest/pack/nixvim/start" | wc -l)" "$dest" "$(du -sh "$dest" | cut -f1)"
        printf 'copy to the target as ~/.config/nvim, or keep it separate with:\n'
        printf '  cp -R %s ~/.config/nvim-nix && NVIM_APPNAME=nvim-nix nvim\n' "$dest"
